name: build and push docker image

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/ubuntu2404-latex
  SLIM_IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/ubuntu2404-latex-slim

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "ディスク容量 (クリーンアップ前):"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "ディスク容量 (クリーンアップ後):"
          df -h

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build slim image metadata
        id: slim-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SLIM_IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Install docker-slim
        run: |
          echo "Installing docker-slim from GitHub..."
          curl -L -o ds.tar.gz https://github.com/slimtoolkit/slim/releases/download/1.40.11/dist_linux.tar.gz
          tar -xvf ds.tar.gz
          sudo mv  dist_linux/slim /usr/local/bin/
          sudo mv  dist_linux/slim-sensor /usr/local/bin/
          docker-slim --version

      - name: Run docker-slim
        run: |
          echo "Running docker-slim on ${{ env.IMAGE_NAME }}:latest"
          docker-slim build \
            --target ${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.SLIM_IMAGE_NAME }}:latest \
            --http-probe=false \
            --show-blogs=false

      - name: Push slim image
        run: |
          echo "Pushing slim image..."
          docker push ${{ env.SLIM_IMAGE_NAME }}:latest

      - name: Show image size comparison
        run: |
          echo "Image size comparison:"
          docker images | grep -E "ubuntu2404-latex"